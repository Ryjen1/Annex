    <text x="0" y="706" font-family="JetBrains Mono, monospace" font-size="17" fill="#5c5c7d">0xfdbfde0a430de94c1d862cfc290c36549b5a501d</text>
    <text x="0" y="740" font-family="JetBrains Mono, monospace" font-size="17" fill="#5c5c7d">github.com/Ryjen1/Annex</text>
