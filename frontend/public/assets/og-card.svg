<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Annex — permissionless prediction markets on Mezo, settled in MUSD">
  <defs>
    <linearGradient id="oCoin" x1="18%" y1="8%" x2="82%" y2="96%">
      <stop offset="0%" stop-color="#ffd9a0" />
      <stop offset="42%" stop-color="#f7931a" />
      <stop offset="100%" stop-color="#8a4c05" />
    </linearGradient>
    <linearGradient id="oBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8c00" />
      <stop offset="45%" stop-color="#ffb454" />
      <stop offset="100%" stop-color="#ffd9a0" />
    </linearGradient>
    <radialGradient id="oHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7931a" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#f7931a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#f7931a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="oFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#030412" stop-opacity="0.94" />
      <stop offset="50%" stop-color="#030412" stop-opacity="0.6" />
      <stop offset="72%" stop-color="#030412" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030412" stop-opacity="0.35" />
    </linearGradient>
    <pattern id="oGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#030412" />
  <rect width="1200" height="630" fill="url(#oGrid)" />

  <g fill="#ffffff">
    <circle cx="110" cy="80" r="1.6" opacity="0.45" />
    <circle cx="280" cy="150" r="1.1" opacity="0.3" />
    <circle cx="430" cy="60" r="1.9" opacity="0.4" />
    <circle cx="610" cy="180" r="1.2" opacity="0.28" />
    <circle cx="1010" cy="90" r="1.5" opacity="0.35" />
    <circle cx="1120" cy="210" r="1.3" opacity="0.3" />
  </g>

  <rect width="1200" height="630" fill="url(#oFade)" />

  <g transform="translate(930 315)">
    <ellipse cx="0" cy="0" rx="250" ry="90" fill="none" stroke="#f7931a" stroke-opacity="0.34" stroke-width="1.3" />
    <ellipse cx="0" cy="0" rx="205" ry="150" fill="none" stroke="#ffb454" stroke-opacity="0.18" stroke-width="1.1" transform="rotate(28)" />
    <circle cx="250" cy="0" r="6" fill="#ffb454" />
    <circle r="220" fill="url(#oHalo)" />
    <circle r="104" fill="url(#oCoin)" />
    <circle r="104" fill="none" stroke="#ffd9a0" stroke-width="2" stroke-opacity="0.5" />
    <g fill="#120a01">
      <text x="0" y="6" text-anchor="middle" dominant-baseline="central" font-family="Outfit, Poppins, Arial, sans-serif" font-size="140" font-weight="700">₿</text>
      <rect x="-52" y="-74" width="10" height="148" rx="5" />
      <rect x="42" y="-74" width="10" height="148" rx="5" />
    </g>
  </g>

  <g transform="translate(80 0)">
    <g transform="translate(0 96)">
      <circle cx="26" cy="26" r="26" fill="url(#oCoin)" />
      <g fill="#120a01">
        <text x="26" y="28" text-anchor="middle" dominant-baseline="central" font-family="Outfit, Poppins, Arial, sans-serif" font-size="35" font-weight="700">₿</text>
        <rect x="12" y="8" width="2.6" height="36" rx="1.3" />
        <rect x="38" y="8" width="2.6" height="36" rx="1.3" />
      </g>
      <text x="66" y="36" font-family="Outfit, Poppins, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="-1.1" fill="url(#oBrand)">Annex</text>
    </g>

    <text x="0" y="250" font-family="Outfit, Poppins, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2.8" fill="#ffffff">Trade the outcome</text>
    <text x="0" y="318" font-family="Outfit, Poppins, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2.8" fill="url(#oBrand)">of anything.</text>

    <text x="0" y="376" font-family="Poppins, Arial, sans-serif" font-size="20" fill="#a3a3b8">Permissionless prediction markets on Mezo.</text>
    <text x="0" y="408" font-family="Poppins, Arial, sans-serif" font-size="20" fill="#a3a3b8">Settled in MUSD · gas in BTC · non-custodial.</text>

    <g transform="translate(0 444)">
      <rect width="190" height="42" rx="21" fill="#f7931a" fill-opacity="0.12" stroke="#f7931a" stroke-opacity="0.4" />
      <text x="95" y="27" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="2.2" fill="#ffb454">MEZO TESTNET</text>
      <rect x="204" width="160" height="42" rx="21" fill="#f7931a" fill-opacity="0.12" stroke="#f7931a" stroke-opacity="0.4" />
      <text x="284" y="27" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="2.2" fill="#ffb454">MUSD</text>
      <rect x="378" width="168" height="42" rx="21" fill="#f7931a" fill-opacity="0.12" stroke="#f7931a" stroke-opacity="0.4" />
      <text x="462" y="27" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="2.2" fill="#ffb454">NON-CUSTODIAL</text>
    </g>

    <text x="0" y="558" font-family="JetBrains Mono, monospace" font-size="16" fill="#8b8ba8">annex-markets.vercel.app · github.com/Ryjen1/Annex</text>
  </g>
</svg>
